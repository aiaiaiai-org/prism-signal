[workspace]
members = [
  "crates/prism-signal-bridge",
  "crates/prism-signal-core",
  "crates/prism-signal-fusion",
  "crates/prism-signal-geo",
  "crates/prism-signal-normalize",
  "crates/prism-signal-observe",
  "crates/prism-signal-protocol",
  "crates/prism-signal-runtime",
  "crates/prism-signal-source",
  "crates/prism-signal-source-telegram",
  "crates/prism-signal-collect",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/aiaiaiai-org/prism-signal"
authors = ["aiaiaiai tech."]

[workspace.dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "symbols"
